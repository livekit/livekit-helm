replicaCount: 2

egress:
  log_level: info
  health_port: 8080
  prometheus_port: 9090
  redis:
    address: <redis_host:port>
  s3:
    region: "us-west-2"
    bucket: "my-egress"

  # Sensitive values — stored in a Kubernetes Secret, never in ConfigMap
  secrets:
    api_key: <api_key>
    api_secret: <secret>
    ws_url: <ws_url>
    s3:
      access_key: <access_key>
      secret: <secret>
