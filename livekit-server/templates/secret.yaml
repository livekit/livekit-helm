{{- if and (not .Values.storeKeysInSecret.existingSecret) .Values.storeKeysInSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "livekit-server.fullname" . }}
  labels:
    {{- include "livekit-server.labels" . | nindent 4 }}
data:
  {{- if and .Values.autogenerateKeys (empty .Values.storeKeysInSecret.keys) (empty .Values.livekit.keys) }}
  {{- $apiKey := randAlphaNum 20 }}
  {{- $apiSecret := randAlphaNum 50 }}
  {{ .Values.livekit.key_file }}: |
    {{ $apiKey }}: {{ $apiSecret }}
  {{- else }}
  {{ .Values.livekit.key_file }}: {{ toYaml .Values.storeKeysInSecret.keys | b64enc }}
  {{- end }}
{{- end }}