{{- $root := . -}}
{{- $instances := default list .Values.instances -}}
{{- if eq (len $instances) 0 -}}
{{- $instances = list (dict "name" "") -}}
{{- end -}}
{{- range $i, $inst := $instances }}
{{- if $i }}
---
{{- end }}
{{- $ctx := dict "root" $root "instance" $inst }}
{{- $resName := include "livekit-server.instanceFullname" $ctx }}
{{- $ns := dict }}
{{- if $root.Values.nodeSelector }}
{{- $ns = deepCopy $root.Values.nodeSelector }}
{{- end }}
{{- if and $inst $inst.nodeSelector }}
{{- $ns = mergeOverwrite $ns $inst.nodeSelector }}
{{- end }}
{{- $tolerations := $root.Values.tolerations }}
{{- if and $inst $inst.tolerations }}
{{- $tolerations = $inst.tolerations }}
{{- end }}
apiVersion: apps/v1
kind: {{ $root.Values.deploymentType }}
metadata:
  name: {{ $resName }}
  labels:
    {{- include "livekit-server.labels" $root | nindent 4 }}
    {{- if $inst.name }}
    livekit.io/instance: {{ $inst.name | quote }}
    {{- end }}
  {{- if $root.Values.deploymentAnnotations }}
  annotations:
    {{- toYaml $root.Values.deploymentAnnotations | nindent 4 }}
  {{- end }}
spec:
  {{- if and (not $root.Values.autoscaling.enabled) (eq $root.Values.deploymentType "Deployment") }}
  replicas: {{ $root.Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "livekit-server.instancePodLabels" $ctx | nindent 6 }}
  {{- if and ($root.Values.deploymentStrategy) (eq $root.Values.deploymentType "Deployment") }}
  strategy:
    {{- toYaml $root.Values.deploymentStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include "livekit-server.instanceLivekitConfig" $ctx | sha256sum }}
      labels:
        {{- include "livekit-server.instancePodLabels" $ctx | nindent 8 }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "livekit-server.serviceAccountName" $root }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- if $root.Values.podHostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      {{- end }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ $root.Chart.Name }}
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag | default $root.Chart.AppVersion }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - "--disable-strict-config"
            {{- if $root.Values.extraArgs }}
            {{- range $root.Values.extraArgs }}
            - "{{ . }}"
            {{- end }}
            {{- end }}
          env:
            - name: LIVEKIT_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: {{ $resName }}
                  key: config.yaml
            {{- if and $root.Values.livekit.turn.enabled $root.Values.livekit.turn.tls_port (not $root.Values.livekit.turn.external_tls) }}
            - name: LIVEKIT_TURN_CERT
              value: /etc/lkcert/tls.crt
            - name: LIVEKIT_TURN_KEY
              value: /etc/lkcert/tls.key
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $root.Values.livekit.port }}
              protocol: TCP
            {{- if $root.Values.livekit.rtc.udp_port }}
            - name: rtc-udp
              containerPort: {{ $root.Values.livekit.rtc.udp_port }}
              hostPort: {{ $root.Values.livekit.rtc.udp_port }}
              protocol: UDP
            {{- end }}
            {{- if $root.Values.livekit.rtc.tcp_port }}
            - name: rtc-tcp
              containerPort: {{ $root.Values.livekit.rtc.tcp_port }}
              hostPort: {{ $root.Values.livekit.rtc.tcp_port }}
              protocol: TCP
            {{- end }}
            {{- if $root.Values.livekit.prometheus_port }}
            - name: metrics
              containerPort: {{ $root.Values.livekit.prometheus_port }}
              hostPort: {{ $root.Values.livekit.prometheus_port }}
              protocol: TCP
            {{- end }}
            {{- if $root.Values.livekit.turn.enabled }}
            {{- if $root.Values.livekit.turn.tls_port }}
            - name: turn-tls
              containerPort: {{ $root.Values.livekit.turn.tls_port }}
              hostPort: {{ $root.Values.livekit.turn.tls_port }}
              protocol: TCP
            {{- end }}
            {{- if $root.Values.livekit.turn.udp_port }}
            - name: turn-udp
              containerPort: {{ $root.Values.livekit.turn.udp_port }}
              hostPort: {{ $root.Values.livekit.turn.udp_port }}
              protocol: UDP
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          {{- if or $root.Values.storeKeysInSecret.enabled (and $root.Values.livekit.turn.enabled $root.Values.livekit.turn.tls_port (not $root.Values.livekit.turn.external_tls)) }}
          volumeMounts:
          {{- if $root.Values.storeKeysInSecret.enabled }}
            - name: keys-volume
              mountPath: /etc/livekit-keys
              readOnly: true
          {{- end }}
          {{- if and $root.Values.livekit.turn.enabled $root.Values.livekit.turn.tls_port (not $root.Values.livekit.turn.external_tls) }}
            - name: lkturncert
              mountPath: /etc/lkcert
              readOnly: true
          {{- end }}
          {{- end }}
      {{- if or $root.Values.storeKeysInSecret.enabled (and $root.Values.livekit.turn.enabled $root.Values.livekit.turn.tls_port (not $root.Values.livekit.turn.external_tls)) }}
      volumes:
        {{- if $root.Values.storeKeysInSecret.enabled }}
        - name: keys-volume
          secret:
            secretName: {{ (tpl $root.Values.storeKeysInSecret.existingSecret $root) | default (include "livekit-server.fullname" $root) }}
            defaultMode: 0600
      {{- end }}
      {{- if and $root.Values.livekit.turn.enabled $root.Values.livekit.turn.tls_port (not $root.Values.livekit.turn.external_tls) }}
        - name: lkturncert
          secret:
            secretName: {{ required "tls secret required if turn enabled" $root.Values.livekit.turn.secretName }}
      {{- end }}
      {{- end }}
      {{- if $ns }}
      nodeSelector:
        {{- toYaml $ns | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
