# Default values for livekit-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: livekit/livekit-server
  pullPolicy: IfNotPresent

imagePullSecrets: []

terminationGracePeriodSeconds: 18000

# configuration for livekit
# you may specify any config settings that are valid in livekit-server's
# config.yaml: https://github.com/livekit/livekit/blob/master/config-sample.yaml
livekit:
  port: 7880
  log_level: info
  rtc:
    tcp_port: 7881
    port_range_start: 50000
    port_range_end: 60000
    use_external_ip: true
  redis:
    {}
    # supports sentinels and cluster, see above
    # address:
    # db: 0
    # username:
    # password:
  # key value pairs (<api_key>: >api_secret>)
  keys:
    {}
  # Api keys can be loaded from a file
  # https://github.com/livekit/livekit/blob/6eaa300949cdfe8fbf6e2ded926c9f8c1a01bc61/pkg/config/config.go#L61
  # In order to set the api keys when using the key_file parameter configure the storeKeysInSecret block below
  # key_file: keys.yaml
  turn:
    enabled: false
    # Must match domain of your tls cert
    # domain: turn.myhost.com
    # secretName: <tlssecret>
    loadBalancerAnnotations: {}
  # webhook: <webhook configuration>
  # room: <default settings for new rooms>
  # region: <set for multi-region deploys>

# Set this option to true if you want to store your API keys in a secret instead of the config file
storeKeysInSecret:
  enabled: false
  # Use a pre existing secret, useful to combine with external secret managers
  # as GCP External Secrets or Hashicorp Vault
  existingSecret: ""
  # Define your API keys and secrets as key-value pairs here. These will be stored in the secret.
  # Example: keys:
  #           my_api_key: my_api_secret
  keys:
    {}
    # key value pairs (<api_key>: >api_secret>)

nameOverride: ""
fullnameOverride: ""

loadBalancer:
  type: disable
  servicePort: 80
  annotations: {}

turnLoadbalancer:
  enable: true

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  # targetMemoryUtilizationPercentage: 80

# if LiveKit should run only on specific nodes
# this can be used to isolate designated nodes
nodeSelector:
  {}
  # node.kubernetes.io/instance-type: c5.2xlarge

resources:
  {}
  # Due to port restrictions, you can run only one instance of LiveKit per physical
  # node. Because of that, we recommend giving it plenty of resources to work with
  # limits:
  #   cpu: 6000m
  #   memory: 2048Mi
  # requests:
  #   cpu: 4000m
  #   memory: 1024Mi

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podHostNetwork: true

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

tolerations: []

affinity: {}

# https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.27/#deploymentstrategy-v1-apps
deploymentStrategy: {}

deploymentAnnotations: {}

# Liveness and readiness probes for the livekit-server container.
#
# These are intentionally exposed as separate, fully structured blocks so that
# operators can tune them independently. In particular, livenessProbe and
# readinessProbe should NOT share the same definition: a liveness failure
# restarts the pod, while a readiness failure only removes it from Service
# endpoints. Conflating the two means any condition that should drain traffic
# also kills the pod and any in-flight sessions.
#
# A common reason to override readinessProbe (without touching livenessProbe)
# is graceful shutdown / connection draining. During the
# terminationGracePeriodSeconds window, livekit-server continues serving
# existing WebRTC sessions but should stop receiving new ones. If your build
# of livekit-server (or a sidecar) exposes a separate "drain" or "ready"
# endpoint that flips to non-200 once SIGTERM is received, point the
# readinessProbe at that endpoint here so Kubernetes removes the pod from
# Service endpoints immediately while the liveness probe keeps the pod alive
# for the rest of the grace period.
#
# Defaults below probe the HTTP healthcheck on the livekit port (named port
# "http", which resolves to livekit.port, 7880 by default). Using the named
# port means probes automatically track any livekit.port override; if you
# replace the httpGet block entirely (e.g. with tcpSocket or exec) you take
# over responsibility for the port reference.
#
# Setting livenessProbe or readinessProbe to null (e.g. "livenessProbe: ~")
# omits that probe from the rendered Deployment entirely.
#
# Test coverage for these values lives in livekit-server/tests/. The
# probe_configuration_test.yaml suite exercises defaults, partial overrides,
# null/omit behavior, and the named-port contract; if you change either probe
# here, run "helm unittest livekit-server/" to confirm your override matches
# expectations before deploying.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  # Matches the Kubernetes default. Lower this (e.g. to 1) when you point the
  # readinessProbe at a drain-aware endpoint and want pods removed from the
  # Service immediately on the first non-200 response.
  failureThreshold: 3

# Specifies configuration gke backendconfig
gcp:
  backendConfig:
    # 10h timeout for websocket
    timeoutSec: 36000
    connectionDraining:
      drainingTimeoutSec: 60

serviceMonitor:
  # Specifies whether a service monitor should be created
  create: false
  # Annotations to add to the service monitor
  annotations: {}
  # The name of the service monitor to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # The scrape interval
  interval: 30s
