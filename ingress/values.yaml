# Default values for ingress.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: livekit/ingress
  pullPolicy: IfNotPresent

ingress:
  logging:
    level: info
  health_port: 7888
  prometheus_port: 7889
  http_relay_port: 9090
  rtmp_port: 1935
  whip_port: 8080
  rtc_config:
    use_external_ip: true
    udp_port: 7885
  redis: {}

  cpu_cost:
    rtmp_cpu_cost: 2
    whip_cpu_cost: 2
    whip_bypass_transcoding_cpu_cost: 0.1

  # Sensitive values go under 'secrets' — these are stored in a Kubernetes Secret,
  # never in the ConfigMap. The Secret merges these into the full config at deploy time.
  secrets: {}
    # api_key: ""
    # api_secret: ""
    # ws_url: ""
    # redis:
    #   password: ""

loadBalancer:
  servicePort: 7888
  annotations: {}

terminationGracePeriodSeconds: 3600

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false

nodeSelector: {}

resources: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podHostNetwork: true

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

podSecurityContext: {}

securityContext: {}

tolerations: []

affinity: {}

# Use a pre-existing secret for the full ingress config (e.g. from External Secrets Operator or Vault).
# When set, neither the chart's Secret nor ConfigMap will contain config — the deployment reads
# from this secret directly.
existingSecret: ""
