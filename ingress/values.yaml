# Default values for ingress.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: livekit/ingress
  pullPolicy: IfNotPresent

ingress:
  logging:
    level: info
  health_port: 7888
  prometheus_port: 7889
  http_relay_port: 9090
  rtmp_port: 1935
  whip_port: 8080
  rtc_config:
    use_external_ip: true
    udp_port: 7885
  redis: {}

  cpu_cost:
    rtmp_cpu_cost: 2
    whip_cpu_cost: 2
    whip_bypass_transcoding_cpu_cost: 0.1

loadBalancer:
  servicePort: 7888
  annotations: {}

terminationGracePeriodSeconds: 3600

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false

nodeSelector: {}

resources: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podHostNetwork: true

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

podSecurityContext: {}

# Ingress may require elevated privileges depending on your setup.
# Override as needed.
securityContext: {}

tolerations: []

affinity: {}

# maxSurge: 0 because host-network pods can't bind the same ports on the same node.
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# Priority class for scheduling priority. Create the PriorityClass resource separately.
priorityClassName: ""

# Lifecycle hooks. preStop gives kube-proxy time to deregister endpoints
# before SIGTERM is sent to the container.
lifecycle:
  preStop:
    exec:
      command: ["sleep", "300"]

# Startup probe allows slow-starting containers to boot before liveness
# kicks in. failureThreshold * periodSeconds = max startup time.
startupProbe:
  httpGet:
    path: /
    port: health
  failureThreshold: 30
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: health
  initialDelaySeconds: 5
  periodSeconds: 5
