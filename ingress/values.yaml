# Default values for ingress.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: livekit/ingress
  pullPolicy: IfNotPresent

ingress:
  logging:
    level: info
  health_port: 7888
  prometheus_port: 7889
  http_relay_port: 9090
  rtmp_port: 1935
  whip_port: 8080
  rtc_config:
    use_external_ip: true
    udp_port: 7885
  redis: {}

  cpu_cost:
    rtmp_cpu_cost: 2
    whip_cpu_cost: 2
    whip_bypass_transcoding_cpu_cost: 0.1

loadBalancer:
  servicePort: 7888
  annotations: {}

terminationGracePeriodSeconds: 3600

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false

nodeSelector: {}

resources: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podHostNetwork: true

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

podSecurityContext: {}

securityContext: {}

tolerations: []

# Default anti-affinity spreads pods across nodes. This is a soft (preferred)
# constraint so single-node clusters degrade gracefully to 1 replica.
# With podHostNetwork: true, port conflicts already prevent two pods on the same
# node, but anti-affinity makes the scheduling intent explicit.
# Override this value to add custom affinity/anti-affinity rules.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - ingress
          topologyKey: kubernetes.io/hostname
