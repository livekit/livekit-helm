# Default values for egress.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: livekit/egress
  pullPolicy: IfNotPresent

egress:
  log_level: info
  health_port: 8080
  prometheus_port: 9090

terminationGracePeriodSeconds: 3600

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false

nodeSelector: {}

resources: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

podSecurityContext: {}

securityContext: {}

tolerations: []

# Default anti-affinity spreads pods across nodes. This is a soft (preferred)
# constraint so single-node clusters degrade gracefully to 1 replica.
# Override this value to add custom affinity/anti-affinity rules.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - egress
          topologyKey: kubernetes.io/hostname
