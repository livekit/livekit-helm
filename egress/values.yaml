# Default values for egress.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: livekit/egress
  pullPolicy: IfNotPresent

egress:
  log_level: info
  health_port: 8080
  prometheus_port: 9090
  # Sensitive values go under 'secrets' — these are stored in a Kubernetes Secret,
  # never in the ConfigMap. The Secret merges these into the full config at deploy time.
  secrets: {}
    # api_key: ""
    # api_secret: ""
    # ws_url: ""
    # redis:
    #   password: ""
    # s3:
    #   access_key: ""
    #   secret: ""
    # gcp:
    #   credentials_json: ""
    # azure:
    #   account_key: ""

terminationGracePeriodSeconds: 3600

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false

nodeSelector: {}

resources: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

podSecurityContext: {}

securityContext: {}

tolerations: []

# Use a pre-existing secret for the full egress config (e.g. from External Secrets Operator or Vault).
# When set, neither the chart's Secret nor ConfigMap will contain config — the deployment reads
# from this secret directly.
existingSecret: ""

affinity: {}
