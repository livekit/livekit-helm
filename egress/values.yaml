# Default values for egress.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: livekit/egress
  pullPolicy: IfNotPresent

egress:
  log_level: info
  health_port: 8080
  prometheus_port: 9090

terminationGracePeriodSeconds: 3600

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false

nodeSelector: {}

resources: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

# Extra labels to add to pods. Useful for network policy selectors.
podLabels: {}

podSecurityContext: {}

securityContext: {}

tolerations: []

affinity: {}

# Pod Disruption Budget ensures minimum availability during voluntary disruptions
# (node drains, cluster upgrades). Disabled by default — enable when running 2+ replicas.
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1
