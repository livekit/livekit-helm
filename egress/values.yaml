# Default values for egress.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: livekit/egress
  pullPolicy: IfNotPresent

egress:
  log_level: info
  health_port: 8080
  prometheus_port: 9090

terminationGracePeriodSeconds: 3600

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false

nodeSelector: {}

resources: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

podSecurityContext: {}

securityContext: {}

tolerations: []

# Store the entire egress config (which contains api_key, api_secret, storage
# credentials) in a Kubernetes Secret instead of a ConfigMap.
storeSecretsInSecret:
  enabled: true
  # Use a pre-existing secret (e.g. from External Secrets Operator or Vault)
  existingSecret: ""

affinity: {}
