# Default values for egress.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: livekit/egress
  pullPolicy: IfNotPresent

egress:
  log_level: info
  health_port: 8080
  prometheus_port: 9090

# Additional environment variables for the egress container. Useful for
# supplying credentials (e.g. LIVEKIT_API_KEY / LIVEKIT_API_SECRET, or
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for S3 uploads) from a Secret
# instead of embedding them in the config ConfigMap.
extraEnv: []
  # - name: LIVEKIT_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: livekit-secrets
  #       key: api-key

# Additional envFrom sources (e.g. secretRef / configMapRef) applied to the
# egress container.
envFrom: []
  # - secretRef:
  #     name: livekit-secrets

terminationGracePeriodSeconds: 3600

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false

nodeSelector: {}

resources: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

podSecurityContext: {}

securityContext: {}

tolerations: []

affinity: {}
